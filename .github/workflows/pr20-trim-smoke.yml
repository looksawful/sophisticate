name: PR20 trim browser smoke

on:
  push:
    branches:
      - fix/trim-range-invariant-13
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trim-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_BASE_PATH: /sophisticate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/trim-range-invariant-13
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Install fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build Pages-like artifact and fixture
        run: |
          npm run build
          node scripts/generate-test-fixtures.mjs
          mkdir -p _smoke-root/sophisticate
          cp -a out/. _smoke-root/sophisticate/
      - name: Prepare Chrome driver
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@latest
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start Pages-like server
        run: |
          python3 -m http.server 4173 --directory _smoke-root >/tmp/sophisticate-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/sophisticate/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sophisticate-http.log
          exit 1
      - name: Trim boundary smoke
        run: |
          cat > .pr20-trim-smoke.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';

          const browser=await chromium.launch({
            headless:true,
            executablePath:process.env.CHROME_PATH,
            args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required'],
          });
          const page=await browser.newPage();

          const pct=async locator=>Number.parseFloat(await locator.evaluate(el=>el.style.left));

          try {
            await page.goto('http://127.0.0.1:4173/sophisticate/',{waitUntil:'networkidle',timeout:60000});
            await page.getByRole('button',{name:'Choose video'}).waitFor({timeout:20000});
            const input=page.locator('input[type="file"]').first();
            await input.setInputFiles('test-fixtures/test-320x240-3s.mp4');
            await page.getByText(/from 320×240/).first().waitFor({state:'attached',timeout:30000});

            const start=page.locator('[data-trim-handle="start"]');
            const end=page.locator('[data-trim-handle="end"]');
            await start.waitFor({state:'visible',timeout:10000});
            await end.waitFor({state:'visible',timeout:10000});

            assert.equal(await pct(start),0,'initial trim start must render at 0%');
            assert.equal(await pct(end),100,'initial trim end must render at 100%');

            const box=await start.evaluate(el=>{
              const timeline=el.parentElement?.parentElement;
              const r=timeline?.getBoundingClientRect();
              return r ? {left:r.left,width:r.width} : null;
            });
            assert(box && box.width>0,'timeline must have a measurable width');

            await start.dispatchEvent('pointerdown',{clientX:box.left+box.width+100,button:0,pointerId:1,isPrimary:true});
            await page.waitForTimeout(100);
            const rightStart=await pct(start);
            const rightEnd=await pct(end);
            assert(Number.isFinite(rightStart) && rightStart>=0 && rightStart<=100,'start handle must stay inside timeline');
            assert.equal(rightEnd,100,'end handle must remain at media end');

            // Reloading the file resets the trim contract to the full duration.
            await input.setInputFiles('test-fixtures/test-320x240-3s.mp4');
            await page.getByText(/from 320×240/).first().waitFor({state:'attached',timeout:30000});
            assert.equal(await pct(start),0);
            assert.equal(await pct(end),100);

            await end.dispatchEvent('pointerdown',{clientX:box.left-100,button:0,pointerId:2,isPrimary:true});
            await page.waitForTimeout(100);
            const leftStart=await pct(start);
            const leftEnd=await pct(end);
            assert.equal(leftStart,0,'start handle must remain at zero');
            assert(Number.isFinite(leftEnd) && leftEnd>=0 && leftEnd<=100,'end handle must stay inside timeline');

            console.log('PR20_TRIM_SMOKE_PASS',JSON.stringify({rightStart,rightEnd,leftStart,leftEnd}));
          } catch (error) {
            console.error('PR20_TRIM_SMOKE_FAILURE',error);
            await page.screenshot({path:'pr20-trim-smoke-failure.png',fullPage:true}).catch(()=>{});
            throw error;
          } finally {
            await browser.close();
          }
          NODE
          node .pr20-trim-smoke.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr20-trim-smoke-failure
          path: pr20-trim-smoke-failure.png
          if-no-files-found: ignore
