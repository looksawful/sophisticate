name: One-shot dependency compatibility cleanup

on:
  push:
    branches:
      - audit/architecture-tooling-2026-09
    paths:
      - .github/workflows/dependency-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/architecture-tooling-2026-09
          fetch-depth: 0

      - name: Setup project Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Use ESLint 9 supported by Next plugins
        run: npm install --save-dev --save-exact eslint@9.39.5

      - name: Remove browser-auto-open dependency chain
        run: |
          npm uninstall open-cli concurrently wait-on
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.scripts["dev:auto"] = "next dev";
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current."
          else
            git commit -m "chore: align ESLint compatibility and remove dev-only helpers"
            git push origin HEAD:audit/architecture-tooling-2026-09
          fi

      - name: Dependency audit evidence
        run: node scripts/report-npm-audit.mjs
