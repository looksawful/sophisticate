name: One-shot Chromium media smoke v2

on:
  push:
    branches:
      - audit/architecture-tooling-2026-09
    paths:
      - .github/workflows/audit-browser-smoke-v2.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /sophisticate
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/architecture-tooling-2026-09
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install FFmpeg CLI test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build static Pages artifact and fixtures
        run: |
          npm run build
          node scripts/generate-test-fixtures.mjs
          mkdir -p _smoke-root/sophisticate
          cp -a out/. _smoke-root/sophisticate/
      - name: Install one-shot browser driver
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@latest
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Start Pages-like local server
        run: |
          python3 -m http.server 4173 --directory _smoke-root >/tmp/sophisticate-http.log 2>&1 &
          echo $! >/tmp/sophisticate-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/sophisticate/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sophisticate-http.log
          exit 1
      - name: Real Chromium FFmpeg WASM smoke
        run: |
          cat > .audit-browser-smoke.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { stat } from 'node:fs/promises';
          import { chromium } from 'playwright-core';
          const baseUrl = 'http://127.0.0.1:4173/sophisticate/';
          const fixture = 'test-fixtures/test-320x240-3s.mp4';
          const coreResponses = [];
          const pageErrors = [];
          const requestFailures = [];
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME_PATH, args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
          const context = await browser.newContext({acceptDownloads:true});
          const page = await context.newPage();
          page.on('response', r => { if (r.url().includes('/ffmpeg-core/')) coreResponses.push({url:r.url(),status:r.status()}); });
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('requestfailed', r => requestFailures.push(`${r.method()} ${r.url()} ${r.failure()?.errorText ?? ''}`));
          const waitMetadata = () => page.getByText(/from 320×240/).waitFor({timeout:30000});
          const downloadTo = async target => {
            const button = page.getByRole('button',{name:/^Download \(/});
            await button.waitFor({timeout:120000});
            const [download] = await Promise.all([page.waitForEvent('download'),button.click()]);
            await download.saveAs(target);
            return stat(target);
          };
          const dims = target => execFileSync('ffprobe',['-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','csv=p=0:s=x',target],{encoding:'utf8'}).trim();
          try {
            const response = await page.goto(baseUrl,{waitUntil:'networkidle',timeout:60000});
            assert.equal(response?.status(),200);
            assert.equal(new URL(page.url()).pathname,'/sophisticate/');
            await page.locator('button').filter({hasText:'Choose file'}).waitFor({timeout:20000});
            await page.locator('input[type="file"]').first().setInputFiles(fixture);
            await waitMetadata();
            await page.getByRole('button',{name:'Convert'}).click();
            await page.getByText('[init] FFmpeg ready',{exact:false}).waitFor({timeout:90000});
            const stopButton = page.getByRole('button',{name:/Stop/});
            await stopButton.waitFor({timeout:10000});
            await stopButton.click();
            await page.getByText('[cancelled] processing stopped',{exact:false}).waitFor({timeout:30000});
            await page.getByRole('button',{name:'Convert'}).waitFor({timeout:10000});
            await page.getByRole('button',{name:'Crop ON'}).click();
            await page.getByRole('button',{name:'Size ON'}).click();
            await page.getByRole('button',{name:'Convert'}).click();
            await page.getByText('[crop] disabled',{exact:false}).waitFor({timeout:120000});
            await page.getByText('size limit=disabled',{exact:false}).waitFor({timeout:120000});
            const unlimited = await downloadTo('/tmp/unlimited.mp4');
            assert.equal(dims('/tmp/unlimited.mp4'),'320x240');
            await page.getByRole('button',{name:'Size OFF'}).click();
            await page.locator('input[type="number"]').first().fill('0.10');
            await page.getByRole('button',{name:'Convert'}).click();
            const limited = await downloadTo('/tmp/limited.mp4');
            const maxBytes = 0.10*1024*1024;
            assert(limited.size <= maxBytes, `${limited.size} > ${maxBytes}`);
            await page.getByRole('button',{name:'Crop OFF'}).click();
            await page.getByRole('button',{name:'3:4'}).click();
            await page.getByRole('button',{name:'Size ON'}).click();
            await page.getByRole('button',{name:'WEBM'}).click();
            await page.getByRole('button',{name:'Convert'}).click();
            const webm = await downloadTo('/tmp/crop.webm');
            assert.equal(dims('/tmp/crop.webm'),'180x240');
            assert.equal(coreResponses.find(x=>x.url.endsWith('/sophisticate/ffmpeg-core/ffmpeg-core.js'))?.status,200);
            assert.equal(coreResponses.find(x=>x.url.endsWith('/sophisticate/ffmpeg-core/ffmpeg-core.wasm'))?.status,200);
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(requestFailures,[]);
            console.log('SMOKE_RESULT '+JSON.stringify({status:'PASS',coreResponses,outputs:{unlimitedMp4Bytes:unlimited.size,limitedMp4Bytes:limited.size,limitedMp4MaxBytes:maxBytes,croppedWebmBytes:webm.size}}));
          } catch (error) {
            await page.screenshot({path:'audit-browser-smoke-failure.png',fullPage:true}).catch(()=>{});
            console.error('BROWSER_SMOKE_FAILURE',error);
            console.error('coreResponses',coreResponses);
            console.error('pageErrors',pageErrors);
            console.error('requestFailures',requestFailures);
            throw error;
          } finally { await browser.close(); }
          NODE
          node .audit-browser-smoke.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-browser-smoke-v2-failure
          path: audit-browser-smoke-failure.png
          if-no-files-found: ignore
