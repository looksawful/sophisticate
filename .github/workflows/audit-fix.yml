name: One-shot safe npm audit fix

on:
  push:
    branches:
      - audit/architecture-tooling-2026-09
    paths:
      - .github/workflows/audit-fix.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/architecture-tooling-2026-09
          fetch-depth: 0

      - name: Setup project Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking npm audit fixes only
        run: npm audit fix

      - name: Verify direct manifest did not receive a forced major change
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.dependencies.next !== "16.3.4") throw new Error(`Unexpected Next change: ${pkg.dependencies.next}`);
          if (pkg.devDependencies.eslint !== "9.39.5") throw new Error(`Unexpected ESLint change: ${pkg.devDependencies.eslint}`);
          NODE

      - name: Commit safe audit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
          else
            git commit -m "chore: apply safe transitive dependency fixes"
            git push origin HEAD:audit/architecture-tooling-2026-09
          fi

      - name: Dependency audit evidence
        run: node scripts/report-npm-audit.mjs
