name: One-shot Chromium media smoke

on:
  push:
    branches:
      - audit/architecture-tooling-2026-09
    paths:
      - .github/workflows/audit-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /sophisticate
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/architecture-tooling-2026-09
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg CLI test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build static Pages artifact and fixtures
        run: |
          npm run build
          node scripts/generate-test-fixtures.mjs
          mkdir -p _smoke-root/sophisticate
          cp -a out/. _smoke-root/sophisticate/

      - name: Install one-shot browser driver
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@latest
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)"
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start Pages-like local server
        run: |
          python3 -m http.server 4173 --directory _smoke-root >/tmp/sophisticate-http.log 2>&1 &
          echo $! >/tmp/sophisticate-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/sophisticate/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sophisticate-http.log
          exit 1

      - name: Real Chromium FFmpeg WASM smoke
        run: |
          cat > .audit-browser-smoke.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { stat } from 'node:fs/promises';
          import { chromium } from 'playwright-core';

          const baseUrl = 'http://127.0.0.1:4173/sophisticate/';
          const fixture = 'test-fixtures/test-320x240-3s.mp4';
          const coreResponses = [];
          const pageErrors = [];
          const requestFailures = [];

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--autoplay-policy=no-user-gesture-required'],
          });
          const context = await browser.newContext({ acceptDownloads: true });
          const page = await context.newPage();

          page.on('response', (response) => {
            if (response.url().includes('/ffmpeg-core/')) {
              coreResponses.push({ url: response.url(), status: response.status() });
            }
          });
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          page.on('requestfailed', (request) => requestFailures.push(`${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`));

          const waitMetadata = async () => {
            await page.getByText(/from 320×240/).waitFor({ timeout: 30_000 });
          };
          const waitDownloadButton = async () => {
            const button = page.getByRole('button', { name: /^Download \(/ });
            await button.waitFor({ timeout: 120_000 });
            return button;
          };
          const downloadTo = async (target) => {
            const button = await waitDownloadButton();
            const [download] = await Promise.all([page.waitForEvent('download'), button.click()]);
            await download.saveAs(target);
            return stat(target);
          };
          const probeDimensions = (target) => execFileSync(
            'ffprobe',
            ['-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=width,height', '-of', 'csv=p=0:s=x', target],
            { encoding: 'utf8' },
          ).trim();

          try {
            const response = await page.goto(baseUrl, { waitUntil: 'networkidle', timeout: 60_000 });
            assert.equal(response?.status(), 200, 'Pages-like route must return 200');
            assert.equal(new URL(page.url()).pathname, '/sophisticate/', 'base-path route must be preserved');
            await page.getByRole('button', { name: 'Choose file' }).waitFor({ timeout: 20_000 });

            await page.locator('input[type="file"]').first().setInputFiles(fixture);
            await waitMetadata();

            // Cancellation must terminate an active FFmpeg instance and allow a later retry.
            await page.getByRole('button', { name: 'Convert' }).click();
            await page.getByText('[init] FFmpeg ready', { exact: false }).waitFor({ timeout: 90_000 });
            const stopButton = page.getByRole('button', { name: /Stop/ });
            await stopButton.waitFor({ timeout: 10_000 });
            await stopButton.click();
            await page.getByText('[cancelled] processing stopped', { exact: false }).waitFor({ timeout: 30_000 });
            await page.getByRole('button', { name: 'Convert' }).waitFor({ timeout: 10_000 });

            // Disabled crop and disabled size limit must be real omitted stages.
            await page.getByRole('button', { name: 'Crop ON' }).click();
            await page.getByRole('button', { name: 'Size ON' }).click();
            await page.getByRole('button', { name: 'Convert' }).click();
            await page.getByText('[crop] disabled', { exact: false }).waitFor({ timeout: 120_000 });
            await page.getByText('size limit=disabled', { exact: false }).waitFor({ timeout: 120_000 });
            const unlimitedStat = await downloadTo('/tmp/sophisticate-unlimited.mp4');
            assert(unlimitedStat.size > 0, 'MP4 download must be non-empty');
            assert.equal(probeDimensions('/tmp/sophisticate-unlimited.mp4'), '320x240', 'crop-off MP4 must preserve full frame');

            // Active size limit must be enforced against the final downloaded artifact.
            await page.getByRole('button', { name: 'Size OFF' }).click();
            const maxSizeInput = page.locator('input[type="number"]').first();
            await maxSizeInput.fill('0.10');
            await page.getByRole('button', { name: 'Convert' }).click();
            const limitedStat = await downloadTo('/tmp/sophisticate-limited.mp4');
            const maxBytes = 0.10 * 1024 * 1024;
            assert(limitedStat.size <= maxBytes, `size-limited MP4 ${limitedStat.size} must be <= ${maxBytes}`);

            // WEBM + active crop proves a second codec/container path and crop semantics after retry.
            await page.getByRole('button', { name: 'Crop OFF' }).click();
            await page.getByRole('button', { name: '3:4' }).click();
            await page.getByRole('button', { name: 'Size ON' }).click();
            await page.getByRole('button', { name: 'WEBM' }).click();
            await page.getByRole('button', { name: 'Convert' }).click();
            const webmStat = await downloadTo('/tmp/sophisticate-crop.webm');
            assert(webmStat.size > 0, 'WEBM download must be non-empty');
            assert.equal(probeDimensions('/tmp/sophisticate-crop.webm'), '180x240', '3:4 crop must produce 180x240 from 320x240 input');

            const jsCore = coreResponses.find((entry) => entry.url.endsWith('/sophisticate/ffmpeg-core/ffmpeg-core.js'));
            const wasmCore = coreResponses.find((entry) => entry.url.endsWith('/sophisticate/ffmpeg-core/ffmpeg-core.wasm'));
            assert.equal(jsCore?.status, 200, 'local ffmpeg-core.js must load through basePath');
            assert.equal(wasmCore?.status, 200, 'local ffmpeg-core.wasm must load through basePath');
            assert.deepEqual(pageErrors, [], `page errors: ${pageErrors.join('\n')}`);
            assert.deepEqual(requestFailures, [], `request failures: ${requestFailures.join('\n')}`);

            console.log(JSON.stringify({
              status: 'PASS',
              baseUrl,
              coreResponses,
              outputs: {
                unlimitedMp4Bytes: unlimitedStat.size,
                limitedMp4Bytes: limitedStat.size,
                limitedMp4MaxBytes: maxBytes,
                croppedWebmBytes: webmStat.size,
              },
            }, null, 2));
          } catch (error) {
            await page.screenshot({ path: 'audit-browser-smoke-failure.png', fullPage: true }).catch(() => {});
            console.error('BROWSER_SMOKE_FAILURE');
            console.error(error);
            console.error('coreResponses', coreResponses);
            console.error('pageErrors', pageErrors);
            console.error('requestFailures', requestFailures);
            throw error;
          } finally {
            await browser.close();
          }
          NODE
          node .audit-browser-smoke.mjs

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-browser-smoke-failure
          path: audit-browser-smoke-failure.png
          if-no-files-found: ignore
