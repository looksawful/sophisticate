name: One-shot dependency security refresh

on:
  push:
    branches:
      - audit/architecture-tooling-2026-09
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/architecture-tooling-2026-09
          fetch-depth: 0

      - name: Setup project Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Refresh production dependencies
        run: |
          npm install --save-exact \
            next@15.5.24 \
            react@19.2.8 \
            react-dom@19.2.8 \
            @ffmpeg/core@0.12.6

      - name: Refresh development dependencies
        run: |
          npm install --save-dev --save-exact \
            eslint-config-next@15.5.24 \
            vitest@4.1.11 \
            concurrently@9.2.4 \
            open-cli@9.0.0 \
            postcss@8.5.28 \
            @types/react@19.2.17 \
            @types/react-dom@19.2.3 \
            @types/node@20

      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current."
          else
            git commit -m "chore: refresh security-sensitive dependencies"
            git push origin HEAD:audit/architecture-tooling-2026-09
          fi

      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit evidence
        run: node scripts/report-npm-audit.mjs
