name: PR21 final cancellation browser smoke

on:
  push:
    branches:
      - fix/cancel-ffmpeg-initialization

permissions:
  contents: read

jobs:
  cancellation-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /sophisticate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/cancel-ffmpeg-initialization
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Install FFmpeg CLI test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build Pages-like artifact and fixture
        run: |
          npm run build
          node scripts/generate-test-fixtures.mjs
          mkdir -p _smoke-root/sophisticate
          cp -a out/. _smoke-root/sophisticate/
      - name: Prepare Chrome driver
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@latest
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Start Pages-like server
        run: |
          python3 -m http.server 4173 --directory _smoke-root >/tmp/sophisticate-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/sophisticate/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sophisticate-http.log
          exit 1
      - name: Cancellation smoke
        run: |
          cat > .pr21-final-smoke.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';

          const browser=await chromium.launch({
            headless:true,
            executablePath:process.env.CHROME_PATH,
            args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required'],
          });
          const page=await browser.newPage();
          const logs=()=>page.locator('details').last().locator('div.font-mono > div').allTextContents();

          try {
            console.log('BROWSER',await browser.version());
            await page.goto('http://127.0.0.1:4173/sophisticate/',{waitUntil:'networkidle',timeout:60000});
            await page.getByRole('button',{name:'Choose video'}).waitFor({timeout:20000});
            await page.locator('input[type="file"]').first().setInputFiles('test-fixtures/test-320x240-3s.mp4');
            await page.getByText(/from 320×240/).first().waitFor({state:'attached',timeout:30000});

            await page.getByRole('button',{name:'Process'}).click();
            const stop=page.getByRole('button',{name:/Stop/});
            await stop.waitFor({state:'visible',timeout:10000});
            await stop.click();
            await page.getByText('[cancelled] processing stopped',{exact:false}).first().waitFor({state:'attached',timeout:30000});
            await page.getByRole('button',{name:'Process'}).waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(3000);
            const afterImmediate=await logs();
            assert.equal(afterImmediate.some(x=>x.includes('[complete]')),false);

            await page.getByRole('button',{name:'Process'}).click();
            await page.getByText('[init] FFmpeg ready',{exact:false}).first().waitFor({state:'attached',timeout:90000});
            await page.getByRole('button',{name:/Stop/}).click();
            await page.getByText('[cancelled] processing stopped',{exact:false}).last().waitFor({state:'attached',timeout:30000});
            await page.getByRole('button',{name:'Process'}).waitFor({state:'visible',timeout:10000});

            await page.getByRole('button',{name:'Process'}).click();
            await page.getByRole('button',{name:/^Download \(/}).waitFor({state:'visible',timeout:120000});

            console.log('PR21_FINAL_SMOKE_PASS');
          } catch (error) {
            console.error('PR21_FINAL_SMOKE_FAILURE',error);
            console.error('uiLogs',await logs().catch(()=>[]));
            await page.screenshot({path:'pr21-final-smoke-failure.png',fullPage:true}).catch(()=>{});
            throw error;
          } finally {
            await browser.close();
          }
          NODE
          node .pr21-final-smoke.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr21-final-cancellation-smoke-failure
          path: pr21-final-smoke-failure.png
          if-no-files-found: ignore
