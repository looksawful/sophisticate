name: Production browser smoke

on:
  push:
    branches:
      - fix/windows-ffmpeg-worker-23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_PUBLIC_BASE_PATH: /sophisticate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned smoke driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ensure FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      - name: Generate deterministic fixture
        run: node scripts/generate-test-fixtures.mjs

      - name: Build production export
        run: npm run build

      - name: Run real Chrome production smoke
        run: node scripts/production-browser-smoke.mjs
